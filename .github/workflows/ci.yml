name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repo; keep the token read-only.
permissions:
  contents: read

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  # Independent of the job above: they share nothing, and gating just serializes them.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Next's documented build-cache recipe; the build runs inside Playwright's webServer.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.mjs', '**/*.ts', '**/*.tsx', '**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: |
          pnpm exec playwright test zz-probe --project=desktop --retries=0 --reporter=line 2>&1 | grep -E 'PROBE|passed|failed' || true
          pnpm exec playwright test tests/e2e/pathfinder.spec.ts --project=iphone --repeat-each=6 --workers=2 --retries=0 --trace=retain-on-failure --reporter=line 2>&1 | tail -40 || true
          pnpm exec playwright test --project=iphone --workers=2 --retries=0 --trace=retain-on-failure --reporter=line 2>&1 | tail -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traces
          path: test-results
          retention-days: 2
